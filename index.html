else if(o.k=='hex')for(let i=0;i<6;i++)g.lineTo(W/2*Math.cos(i*Math.PI/3),D/2*Math.sin(i*Math.PI/3));
else if(o.k=='cor'){g.scale(W/1.95,D/1.8);g.translate(0,.13);g.moveTo(0,-1);g.bezierCurveTo(-1.3,-.2,-1,.9,0,.5);g.bezierCurveTo(1,.9,1.3,-.2,0,-1)}
else{const r=Math.min(D*.3,W*.3);g.moveTo(-W/2+r,-D/2);g.arcTo(W/2,-D/2,W/2,D/2,r);g.arcTo(W/2,D/2,-W/2,D/2,r);g.arcTo(-W/2,D/2,-W/2,-D/2,r);g.arcTo(-W/2,-D/2,W/2,-D/2,r)}

if(hd>0){g.beginPath();g.arc(cx,0,R,0,TAU);g.fill();g.globalCompositeOperation='destination-out';g.beginPath();g.arc(cx,0,hd/2,0,TAU);g.fill()}ox=-(x0+x1)/2}
const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,A=new Uint8Array(c.width*c.height);for(let i=0;i<A.length;i++)A[i]=d[i*4+3]>127?1:0;
o._m=bm2mesh(A,c.width,c.height);o.w=c.width*res;o.d=c.height*res;o.ox=ox}
const MS=o=>{if(o.t!='txt'&&o.t!='llav')return SH[o.t].m;if(!o._m)build(o);return o._m};
function freeMesh(o){if(o._m){gl.deleteBuffer(o._m.bp);gl.deleteBuffer(o._m.bn)}o._m=null;o._w=null}
/* ---------- selección y cámara ---------- */
function ray(e){const b=cv.getBoundingClientRect(),v=view(),th=Math.tan(.4),x=2*(e.clientX-b.left)/b.width-1,y=1-2*(e.clientY-b.top)/b.height,k=b.width/b.height;
return{o:v.e,d:nz([0,1,2].map(i=>v.fw[i]+v.s[i]*x*th*k+v.u[i]*y*th)),v}}
function hit(r){let best=null,bt=1e9;for(const o of objs){const w=world(o);for(let i=0;i<w.length;i+=9){const A=[w[i],w[i+1],w[i+2]],e1=sub([w[i+3],w[i+4],w[i+5]],A),e2=sub([w[i+6],w[i+7],w[i+8]],A),p=cr(r.d,e2),det=dt(e1,p);if(Math.abs(det)<1e-9)continue;const tv=sub(r.o,A),u=dt(tv,p)/det;if(u<0||u>1)continue;const q=cr(tv,e1),v=dt(r.d,q)/det;if(v<0||u+v>1)continue;const t=dt(e2,q)/det;if(t>0&&t<bt){bt=t;best=o}}}return best}
const plane=(r,z)=>Math.abs(r.d[2])<1e-6?null:(t=>t>0?[r.o[0]+r.d[0]*t,r.o[1]+r.d[1]*t]:null)((z-r.o[2])/r.d[2]);
const P=new Map();let mode,drag,moved,pd,pre;
const pdist=()=>{const a=[...P.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);moved=false;
if(P.size==2){mode='pinch';pd=pdist();drag=null;return}
const r=ray(e),o=hit(r);
if(o){sel=o.id;ui();dirty=true;const s=plane(r,o.z);drag=s&&{o,s,x:o.x,y:o.y};pre=snap();mode='drag'}else mode=(e.button==2||e.shiftKey)?'pan':'orbit'};
cv.onpointermove=e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];P.set(e.pointerId,[e.clientX,e.clientY]);
if(mode=='pinch'&&P.size==2){const n=pdist();cam.d=Math.min(1200,Math.max(20,cam.d*pd/n));pd=n;dirty=true;return}
if(Math.abs(dx)+Math.abs(dy)>0)moved=moved||Math.hypot(dx,dy)>1;
if(mode=='orbit'){cam.az-=dx*.007;cam.el=Math.min(1.5,Math.max(.05,cam.el+dy*.007));dirty=true}
else if(mode=='pan'){const v=view(),k=cam.d*.0016;for(let i=0;i<2;i++)cam.t[i]+=-v.s[i]*dx*k+v.u[i]*dy*k;dirty=true}
else if(mode=='drag'&&drag){const h=plane(ray(e),drag.o.z);if(!h)return;const g=+$('#sn').value,o=drag.o;if(!drag.m){if(Math.hypot(h[0]-drag.s[0],h[1]-drag.s[1])<1.5)return;drag.m=1;hist(pre)}
o.x=Math.round((drag.x+h[0]-drag.s[0])/g)*g;o.y=Math.round((drag.y+h[1]-drag.s[1])/g)*g;o._w=null;dirty=true;ui()}};
const up=e=>{if(!P.delete(e.pointerId))return;if(mode=='orbit'&&!moved&&sel!=null){sel=null;ui();dirty=true}if(mode=='drag'&&drag&&drag.m)save();if(P.size<2&&mode=='pinch')mode=null};
cv.onpointerup=up;cv.onpointercancel=up;cv.oncontextmenu=e=>e.preventDefault();
cv.onwheel=e=>{e.preventDefault();cam.d=Math.min(1200,Math.max(20,cam.d*Math.exp(e.deltaY*.001)));dirty=true};
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.key=='Delete'||e.key=='Backspace')del();else if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();undo()}else if((e.ctrlKey||e.metaKey)&&e.key=='d'){e.preventDefault();dup()}});
/* ---------- STL y archivos ---------- */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function stl(){if(!objs.length){alert('Añade al menos una forma antes de exportar.');return}
let n=0;const ws=objs.map(world);ws.forEach(w=>n+=w.length/9);
const b=new ArrayBuffer(84+50*n),v=new DataView(b);v.setUint32(80,n,true);let q=84;
for(const w of ws)for(let i=0;i<w.length;i+=9){const a=[w[i],w[i+1],w[i+2]],nr=nz(cr(sub([w[i+3],w[i+4],w[i+5]],a),sub([w[i+6],w[i+7],w[i+8]],a)));
[...nr,...w.subarray(i,i+9)].forEach((x,k)=>v.setFloat32(q+k*4,x,true));q+=50}
dl(new Blob([b],{type:'model/stl'}),'modelo.stl')}
